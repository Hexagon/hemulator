[package]
name = "emu_nes"
version = "0.1.0"
edition = "2021"

[dependencies]
emu_core = { path = "../../core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
crc32fast = "1.4"

# OpenGL dependencies (optional)
glow = { version = "0.13", optional = true }

[features]
default = []
opengl = ["dep:glow"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "nes_hotpaths"
harness = false
