[package]
name = "emu_core"
version = "0.1.0"
edition = "2021"

[dependencies]
# Chip crates — broken out from emu_core for independent reuse / future separate repos
hemu-8080     = { path = "../chips/hemu-8080" }
hemu-z80      = { path = "../chips/hemu-z80" }
hemu-lr35902  = { path = "../chips/hemu-lr35902" }
hemu-6502     = { path = "../chips/hemu-6502" }
hemu-65c816   = { path = "../chips/hemu-65c816" }
hemu-8086     = { path = "../chips/hemu-8086" }
hemu-arm7tdmi = { path = "../chips/hemu-arm7tdmi" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = "0.4"
log = "0.4"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "cpu_6502"
harness = false
