[package]
name = "emu_gui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "hemu"
path = "src/main.rs"

[dependencies]
emu_core = { path = "../../core" }
emu_nes = { path = "../../systems/nes", features = ["opengl"] }
emu_gb = { path = "../../systems/gb" }
hemu_gba = { path = "../../systems/gba" }
emu_atari2600 = { path = "../../systems/atari2600" }
emu_atari5200 = { path = "../../systems/atari5200" }
emu_pc = { path = "../../systems/pc" }
emu_snes = { path = "../../systems/snes" }
emu_sms = { path = "../../systems/sms" }
emu_n64 = { path = "../../systems/n64" }
emu_chip8 = { path = "../../systems/chip8" }
emu_colecovision = { path = "../../systems/colecovision" }
emu_sg1000 = { path = "../../systems/sg1000" }
emu_ps1 = { path = "../../systems/ps1" }
emu_gameandwatch = { path = "../../systems/gameandwatch" }
emu_megadrive = { path = "../../systems/megadrive" }
rodio = "0.22"
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
png = "0.18"
serde_json = "1.0"
sha2 = "0.10"
base64 = "0.22"
open = "5.0"
rfd = "0.17"
rand = "0.10"
chrono = "0.4"

# Window and rendering support
sdl2 = { version = "0.38", features = ["bundled"] }
glow = "0.16"
bytemuck = "1.14"

# egui support
egui = "0.34"
egui_glow = "0.34"
egui_extras = { version = "0.34", features = ["image"] }
egui_sdl2_gl = "0.33"
egui_dock = "0.19"

[build-dependencies]
# Windows resource embedding
[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[features]
default = ["opengl"]
opengl = []
