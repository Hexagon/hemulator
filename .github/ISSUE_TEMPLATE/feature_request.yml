name: 🚀 Feature Request
description: Suggest a new feature or enhancement for Hemulator
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a new feature! Please fill out the information below to help us understand your request.

  - type: textarea
    id: feature-description
    attributes:
      label: Feature Description
      description: What feature would you like to see added?
      placeholder: A clear and concise description of the feature you'd like to see.
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: How would this feature be used? What problem does it solve?
      placeholder: Describe a scenario where this feature would be useful.
    validations:
      required: true

  - type: dropdown
    id: system
    attributes:
      label: Which system(s) would this feature apply to?
      multiple: true
      options:
        - All systems
        - NES
        - Game Boy / Game Boy Color
        - Atari 2600
        - SNES
        - Nintendo 64
        - PC/DOS
        - Sega Master System
        - CHIP-8
        - GUI/Frontend
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or features?
      placeholder: Any alternative approaches you've thought about.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or examples about the feature request.
      placeholder: Any additional information that might be helpful.
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Guidelines
      description: Please confirm the following
      options:
        - label: I have searched existing issues to make sure this isn't a duplicate
          required: true
        - label: This feature aligns with the project's goals as an educational emulator
          required: true
